<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#a8a59e">
<meta name="description" content="A dithered 3D field study in Godot. Grow, tune and share a living ink landscape.">
<title>Moss / Ink - Field Study 03</title>
<style>
html,body,#canvas{margin:0;padding:0;border:0}
body{background:#a8a59e;color:#28241f;overflow:hidden;touch-action:none;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
#canvas{display:block;width:100vw;height:100vh;height:100dvh}
#canvas:focus{outline:none}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#a8a59e;transition:opacity .5s}
#boot.gone{opacity:0;pointer-events:none}
.mark{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.bar{width:132px;height:1px;background:rgba(40,36,31,.25);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#28241f;transition:width .2s}
.sub{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#4a453d}
#rest{display:none;max-width:280px;text-align:center;line-height:1.6}
#rest strong{display:block;font:400 30px/1.1 "Iowan Old Style",Baskerville,"Times New Roman",serif;margin-bottom:10px;letter-spacing:0}
#rest span{font-size:10px;color:#4a453d}
#boot.resting .bar,#boot.resting .sub{display:none}
#boot.resting #rest{display:block}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<canvas id="canvas" aria-label="A dithered three-dimensional ink landscape">A current browser is needed to draw this field.</canvas>
<noscript><p style="padding:24px">This field is drawn with JavaScript and WebGL 2.</p></noscript>
<div id="boot" role="status" aria-live="polite">
  <div class="mark">Moss / Ink</div>
  <div class="bar"><i id="fill"></i></div>
  <div class="sub" id="sub">growing the field</div>
  <div id="rest"><strong>The field is resting.</strong><span id="restmsg">This browser cannot draw the 3D study. Try a current browser with hardware acceleration turned on.</span></div>
</div>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":214012,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
(function () {
  const boot = document.getElementById('boot'), fill = document.getElementById('fill');
  function rest(msg, err) {
    if (err) console.error(err);
    if (msg) document.getElementById('restmsg').textContent = msg;
    boot.classList.add('resting');
  }
  let engine;
  try { engine = new Engine(GODOT_CONFIG); } catch (e) { rest(null, e); return; }
  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length) { rest(null, missing.join(', ')); return; }
  engine.startGame({
    onProgress: function (cur, tot) { if (cur > 0 && tot > 0) fill.style.width = Math.round(cur / tot * 100) + '%'; }
  }).then(function () {
    fill.style.width = '100%';
    setTimeout(function () { boot.classList.add('gone'); setTimeout(function () { boot.remove(); }, 600); }, 250);
  }, function (e) { rest('The field could not finish loading. Check the connection and open the page again.', e); });
}());
</script>
</body>
</html>
